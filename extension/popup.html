<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scam Shield</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">

    <div class="header">
      <div class="logo-wrap">
        <div class="logo-glow" id="headerGlow"></div>
        <div class="logo-box">🛡️</div>
      </div>
      <div class="header-text">
        <h1 class="title">Scam Shield</h1>
        <p class="subtitle">Live chat campaign detection</p>
      </div>
    </div>

    <div class="card">
      <div class="toggle-row">
        <div>
          <div class="toggle-label">Detection Engine</div>
          <div class="status-line">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">Active</span>
          </div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggleShield" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Session</div>
      <div class="stats-row">
        <div class="stat-cell">
          <div class="stat-num" id="statScanned">0</div>
          <div class="stat-name">Scanned</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-cell">
          <div class="stat-num warn" id="statFlagged">0</div>
          <div class="stat-name">Suspicious</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-cell">
          <div class="stat-num danger" id="statScam">0</div>
          <div class="stat-name">Campaign</div>
        </div>
      </div>
    </div>

    <div class="footer">Scam Shield &middot; Campaign & Coordination Detector</div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
